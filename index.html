<style>
:root{
  --sauge:#7D8D79;--sauge-clair:#A8B5A4;--sauge-bg:rgba(125,141,121,.07);
  --terracotta:#B06D5D;--terracotta-doux:#c4897b;--beige:#F5F1E8;
  --or:#C8A96B;--encre:#33372F;--encre-doux:#6B6F65;--blanc:#FDFCF9;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{font-family:'Jost',system-ui,sans-serif;font-weight:300;background:var(--beige);color:var(--encre);line-height:1.7}
.top-bar{position:fixed;top:10px;right:10px;z-index:100;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;background:rgba(253,252,249,.92);padding:6px 8px;border-radius:20px;box-shadow:0 2px 10px rgba(0,0,0,.08);max-width:220px}
.lang-btn,.read-btn{background:none;border:1px solid rgba(125,141,121,.3);color:var(--encre-doux);font-size:.72rem;padding:4px 9px;border-radius:14px;cursor:pointer;transition:all .2s;white-space:nowrap;font-family:inherit}
.lang-btn.active{background:var(--sauge);color:var(--blanc);border-color:var(--sauge)}
.lang-btn:hover,.read-btn:hover{border-color:var(--sauge)}
.hero{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 24px 24px;text-align:center;position:relative;overflow:hidden}
.hero-video{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;z-index:0}
.hero-overlay{position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(245,241,232,.85);z-index:1}
.hero>*:not(.hero-video):not(.hero-overlay){position:relative;z-index:2}
.section{max-width:640px;margin:0 auto;padding:28px 24px;opacity:0;transform:translateY(30px);transition:opacity .7s ease,transform .7s ease}
.section.visible{opacity:1;transform:none}
.divider{width:44px;height:1px;background:var(--or);margin:16px auto}
h1{font-family:'Playfair Display',Georgia,serif;font-weight:500;font-size:clamp(2.2rem,7vw,3rem);line-height:1.15;letter-spacing:-.01em;margin-bottom:20px;color:var(--encre)}
h2{font-family:'Playfair Display',Georgia,serif;font-weight:500;font-size:clamp(1.4rem,4.5vw,1.9rem);line-height:1.3;margin-bottom:16px;color:var(--encre)}
.sub{color:var(--encre-doux);font-size:1.15rem;font-weight:400;margin-bottom:14px;max-width:52ch}
.sub-strong{color:var(--encre);font-size:1.2rem;font-weight:500;margin-bottom:16px;max-width:56ch}
.signature{font-family:'Playfair Display',serif;font-style:italic;color:var(--terracotta);font-size:1.2rem;margin-top:16px}
.portrait{width:140px;height:140px;border-radius:50%;object-fit:cover;border:3px solid var(--or);margin-bottom:28px;box-shadow:0 6px 24px rgba(51,55,47,.15)}
.logo-img{max-width:280px;width:80%;height:auto;margin-top:8px}
.logo-txt{display:inline-block;margin-top:6px}
.filter-box{background:var(--blanc);border-radius:6px;padding:24px 22px;border:1px solid rgba(125,141,121,.15);text-align:left}
.filter-box h3{font-family:'Playfair Display',serif;font-weight:500;font-size:1.05rem;margin-bottom:10px}
.filter-box ul{list-style:none;margin:0 0 18px}
.filter-box ul:last-child{margin-bottom:0}
.filter-box li{padding:4px 0 4px 24px;font-size:.95rem;color:var(--encre-doux);position:relative}
.filter-box li::before{content:'';position:absolute;left:0;top:13px;width:8px;height:8px;border-radius:50%}
.pour li::before{background:var(--sauge)}
.moins li::before{background:var(--terracotta-doux)}
.options{display:flex;flex-direction:column;gap:10px;margin:20px 0 24px}
.opt{display:flex;align-items:center;gap:14px;background:var(--blanc);border:1.5px solid rgba(125,141,121,.2);border-radius:6px;padding:16px 20px;cursor:pointer;transition:all .25s ease;font-size:1rem}
.opt:hover{border-color:var(--sauge);background:var(--sauge-bg);transform:translateX(4px)}
.opt input{position:absolute;opacity:0;pointer-events:none}
.mark{flex:0 0 20px;height:20px;border:1.5px solid var(--sauge-clair);border-radius:50%;position:relative;transition:.2s}
.opt[data-multi] .mark{border-radius:4px}
.opt.on{border-color:var(--sauge);background:var(--sauge-bg)}
.opt.on .mark{border-color:var(--sauge);background:var(--sauge)}
.opt.on .mark::after{content:'';position:absolute;inset:0;margin:auto;width:6px;height:6px;background:var(--blanc);border-radius:50%}
.opt[data-multi].on .mark::after{width:9px;height:5px;border:1.5px solid var(--blanc);border-top:0;border-right:0;background:none;border-radius:0;transform:rotate(-45deg) translate(1px,-2px)}
.opt-text{flex:1}
.field{margin-bottom:18px}
.lbl{display:block;font-size:.9rem;margin-bottom:7px;color:var(--encre-doux)}
input[type=text],input[type=email],input[type=tel]{width:100%;font-family:inherit;font-size:1rem;font-weight:300;padding:14px 16px;background:var(--blanc);color:var(--encre);border:1.5px solid rgba(125,141,121,.2);border-radius:6px;transition:border-color .2s}
input:focus{outline:none;border-color:var(--sauge);box-shadow:0 0 0 3px rgba(125,141,121,.12)}
.consent{display:flex;gap:12px;align-items:flex-start;font-size:.88rem;color:var(--encre-doux);margin:22px 0}
.consent input{margin-top:4px;accent-color:var(--sauge);width:17px;height:17px;flex:0 0 auto}
button{font-family:inherit;font-size:.95rem;cursor:pointer;border:none}
.btn-primary{background:var(--terracotta);color:var(--blanc);padding:16px 36px;border-radius:6px;letter-spacing:.03em;transition:background .2s,transform .12s;font-size:1rem}
.btn-primary:hover{background:#9c5d4e}
.btn-primary:active{transform:scale(.98)}
.btn-primary:disabled{background:var(--sauge-clair);cursor:not-allowed}
.btn-scroll{background:none;border:none;color:var(--terracotta);font-family:'Playfair Display',serif;font-style:italic;font-size:1.1rem;cursor:pointer;margin-top:16px;transition:color .2s}
.btn-scroll:hover{color:#9c5d4e}
.btn-scroll::after{content:' \2193';font-style:normal}
.card-link{display:block;background:var(--blanc);border-left:3px solid var(--sauge);padding:18px 20px;margin-bottom:12px;text-decoration:none;color:var(--encre);border-radius:0 6px 6px 0;transition:transform .15s,border-color .2s,box-shadow .2s}
.card-link:hover{transform:translateX(4px);border-color:var(--terracotta);box-shadow:0 2px 12px rgba(0,0,0,.06)}
.card-link strong{display:block;font-weight:500;margin-bottom:3px}
.card-link span{font-size:.87rem;color:var(--encre-doux)}
.card-link .cta{display:block;color:var(--terracotta);font-size:.85rem;margin-top:6px;font-weight:500}
.socials{display:flex;gap:12px;flex-wrap:wrap;margin:12px 0 20px}
.social{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;background:var(--blanc);border:1px solid rgba(125,141,121,.15);border-radius:6px;text-decoration:none;color:var(--encre);font-size:.9rem;transition:all .2s}
.social:hover{background:var(--sauge-bg);border-color:var(--sauge)}
.small-lbl{font-size:.85rem;color:var(--encre-doux);margin-top:16px}
.coordonnees{background:var(--blanc);border-radius:6px;padding:24px;margin:24px 0;border:1px solid rgba(125,141,121,.15)}
.coordonnees p{margin-bottom:6px;font-size:.95rem}
.coordonnees a{color:inherit;text-decoration:none;font-weight:500}
footer{text-align:center;padding:28px 24px;font-size:.82rem;color:var(--encre-doux);border-top:1px solid rgba(125,141,121,.1);max-width:640px;margin:0 auto}
.mentions{margin-top:16px;font-size:.8rem;line-height:1.6;color:var(--encre-doux);text-align:left}
.mentions .mt{font-weight:500;color:var(--encre);margin:14px 0 6px}
.mentions .mt:first-child{margin-top:0}
.credit{margin-top:18px;padding-top:12px;border-top:1px solid rgba(125,141,121,.15);text-align:center;font-style:italic}
.err{color:var(--terracotta);font-size:.88rem;margin-top:12px;min-height:1.2em}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;vertical-align:-2px;margin-right:8px}
@keyframes spin{to{transform:rotate(360deg)}}
.hidden{display:none !important}
.section-title{font-family:'Playfair Display',serif;font-weight:500;font-size:1.1rem;color:var(--encre-doux);margin-bottom:16px}
@media(max-width:480px){.hero{padding:40px 20px 20px}.section{padding:24px 20px}.filter-box{padding:20px 18px}.top-bar{max-width:170px}}
</style>
</head>

var currentLang = 'fr';

/* ─────────── Origine : qui a invité la personne ───────────
   Lien à partager : https://agnesetvous.com/?origine=nathalie
   Le prénom est gardé en mémoire dans le navigateur de la personne,
   même si elle passe d'abord par /bilan, /evolution, etc. */
var ORIGINE = (function(){
  var o = '';
  try {
    var p = new URLSearchParams(window.location.search);
    o = (p.get('origine') || p.get('o') || p.get('ref') || '').trim().slice(0, 60);
    if(o){ localStorage.setItem('origine', o); }
    else { o = localStorage.getItem('origine') || ''; }
  } catch(e){}
  return o;
})();
function origineLisible(o){
  return o.replace(/[-_.+]+/g, ' ').replace(/\s+/g, ' ').trim()
          .replace(/(^|\s)(\S)/g, function(m, s, c){ return s + c.toUpperCase(); });
}
function avecOrigine(url){
  if(!ORIGINE || !url) return url;
  try {
    var u = new URL(url, window.location.href);
    if(!u.searchParams.has('origine')) u.searchParams.set('origine', ORIGINE);
    return u.toString();
  } catch(e){ return url; }
}
var TTS = ('speechSynthesis' in window) && ('SpeechSynthesisUtterance' in window);
var data = {};

function esc(s){ return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function plain(s){ return s.replace(/&amp;/g,'&').replace(/<[^>]+>/g,''); }
function commenceParVoyelle(s){ return /^[aeiouyhàâäéèêëîïôöùûüœ]/i.test(String(s).trim()); }

function fill(s){
  var C = CONFIG;
  var map = {
    prenom: C.PRENOM, marque: C.MARQUE, nomComplet: C.NOM_COMPLET,
    ville: C.VILLE, region: C.REGION, statut: C.STATUT, siret: C.SIRET,
    adresse: C.ADRESSE, email: C.EMAIL, tel: C.TELEPHONE,
    hebergeur: C.HEBERGEUR, registrar: C.REGISTRAR_DOMAINE, n: C.CONSERVATION_ANS, axes: axesTexte(), Axes: majuscule(axesTexte()),
    de_marque: (commenceParVoyelle(C.MARQUE) ? "d'" : "de ") + C.MARQUE,
    que_prenom: (commenceParVoyelle(C.PRENOM) ? "qu'" : "que ") + C.PRENOM
  };
  return String(s).replace(/\{(\w+)\}/g, function(m, k){ return (k in map) ? esc(map[k]) : m; });
}

function majuscule(s){ return s ? s.charAt(0).toUpperCase() + s.slice(1) : s; }
function axesTexte(){
  var T = TRANSLATIONS[currentLang] || TRANSLATIONS.fr, C = CONFIG, l = [];
  if(C.AXE_BIENETRE)  l.push(T.axe_bienetre);
  if(C.AXE_EVOLUTION) l.push(T.axe_evolution);
  if(C.AXE_NUMERIQUE) l.push(T.axe_numerique);
  if(C.AXE_PERSO_TITRE) l.push(C.AXE_PERSO_TITRE.toLowerCase());
  return l.join(', ');
}

  } catch(e){}

function remplirListe(listeId, blocId, items){
  var liste = document.getElementById(listeId);
  var n = 0;
  items.forEach(function(it){
    if(!it[1]) return;
    var a = document.createElement('a');
    a.className = 'social'; a.href = it[1]; a.target = '_blank'; a.rel = 'noopener';
    if(it[0].charAt(0) === '@'){ a.setAttribute('data-i18n', it[0].slice(1)); } else { a.textContent = it[0]; }
    liste.appendChild(a); n++;
  });
  if(n === 0) document.getElementById(blocId).classList.add('hidden');
}

/* ─────────── Langues ─────────── */
function setLanguage(lang){
  currentLang = lang;
  var T = TRANSLATIONS[lang];
  document.documentElement.lang = lang;
  document.title = plain(fill(T.title));
  var md = document.querySelector('meta[name="description"]');
  if(md) md.setAttribute('content', plain(fill(T.description)));
  document.querySelectorAll('[data-i18n]').forEach(function(el){
    var key = el.getAttribute('data-i18n');
    if(T[key] !== undefined){ el.innerHTML = fill(T[key]); }
  });
  document.querySelectorAll('[data-i18n-ph]').forEach(function(el){
    var key = el.getAttribute('data-i18n-ph');
    if(T[key] !== undefined){ el.setAttribute('placeholder', plain(fill(T[key]))); }
  });
  ['fr','en','es'].forEach(function(l){ document.getElementById('btn' + l.toUpperCase()).classList.toggle('active', l === lang); });
  var prenom = document.getElementById('prenom').value.trim();
  if(prenom) document.getElementById('merciTitre').textContent = T.merci_prefix + ', ' + prenom + '.';
  if(TTS && window.speechSynthesis.speaking){ window.speechSynthesis.cancel(); }
  isSpeaking = false;
  updateReadBtn();
}

/* ─────────── Lecture audio ─────────── */
var isSpeaking = false;
function updateReadBtn(){
  var btn = document.getElementById('btnRead');
  btn.textContent = isSpeaking ? ('⏹ ' + TRANSLATIONS[currentLang].stop_label) : '🔊';
}
function toggleReadAloud(){
  if(!TTS) return;
  if(isSpeaking){ window.speechSynthesis.cancel(); isSpeaking = false; updateReadBtn(); return; }
  var morceaux = document.getElementById('contenuPrincipal').innerText.split(/\n+/)
    .map(function(s){ return s.trim(); }).filter(function(s){ return s.length > 1; });
  if(!morceaux.length) return;
  var langue = currentLang === 'fr' ? 'fr-FR' : (currentLang === 'en' ? 'en-US' : 'es-ES');
  var fin = function(){ isSpeaking = false; updateReadBtn(); };
  morceaux.forEach(function(txt, i){
    var u = new SpeechSynthesisUtterance(txt);
    u.lang = langue;
    if(i === morceaux.length - 1){ u.onend = fin; }
    u.onerror = fin;
    window.speechSynthesis.speak(u);
  });
  isSpeaking = true;
  updateReadBtn();
}

/* ─────────── Partage ─────────── */
function shareSite(){
  var btn = document.getElementById('btnShare');
  if(navigator.share){
    navigator.share({ title: document.title, url: window.location.href }).catch(function(){});
  } else if(navigator.clipboard){
    var original = btn.innerHTML;
    navigator.clipboard.writeText(window.location.href).then(function(){
      btn.innerHTML = '✓';
      window.setTimeout(function(){ btn.innerHTML = original; }, 1500);
    });
  }
}

/* ─────────── Apparition des sections ─────────── */
var observer = new IntersectionObserver(function(entries){
  entries.forEach(function(entry){ if(entry.isIntersecting) entry.target.classList.add('visible'); });
}, { threshold: 0.1 });
document.querySelectorAll('.section').forEach(function(s){ observer.observe(s); });

function show(id){
  var el = document.getElementById(id);
  if(el){ el.classList.remove('hidden'); el.classList.add('visible'); }
}
function reveal(dividerId, sectionId){
  show(dividerId); show(sectionId);
  window.setTimeout(function(){
    var el = document.getElementById(sectionId);
    if(el) el.scrollIntoView({ behavior:'smooth', block:'center' });
  }, 100);
}
function toggleChamp(id, visible){ document.getElementById(id).classList.toggle('hidden', !visible); }

/* ─────────── Choix ─────────── */
function collect(group){
  var values = [];
  group.querySelectorAll('input:checked').forEach(function(i){ values.push(i.value); });
  data[group.dataset.name] = values.join(' / ');
}

document.querySelectorAll('.opt input').forEach(function(input){
  input.addEventListener('change', function(){
    var opt = input.closest('.opt');
    var group = input.closest('.options');
    if(input.type === 'radio'){
      group.querySelectorAll('.opt').forEach(function(o){ o.classList.remove('on'); });
      opt.classList.add('on');
      if(input.name === 'source'){
        toggleChamp('champReco', input.value === 'Recommandation');
        toggleChamp('champQ1Autre', input.value === 'Autre');
      }
    } else {
      opt.classList.toggle('on', input.checked);
      if(input.id === 'q2AutreCheckbox') toggleChamp('champQ2Autre', input.checked);
      if(input.id === 'rdvConfCheckbox') toggleChamp('champConfSujet', input.checked);
      if(input.id === 'rdvEventCheckbox') toggleChamp('champEventVille', input.checked);
    }
    collect(group);
  });
});

/* ─────────── Envoi ─────────── */
function submitForm(){
  var err = document.getElementById('err');
  var T = TRANSLATIONS[currentLang];
  var prenom = document.getElementById('prenom').value.trim();
  var email = document.getElementById('email').value.trim();
  var telephone = document.getElementById('telephone').value.trim();

  if(!prenom){ err.textContent = T.err_prenom; return; }
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)){ err.textContent = T.err_email; return; }
  var canalInput = document.querySelector('input[name="canal"]:checked');
  var canal = canalInput ? canalInput.value : "";
  if(canal === "Appel" && !telephone){ err.textContent = T.err_telephone; return; }
  if(!document.getElementById('rgpd').checked){ err.textContent = T.err_rgpd; return; }
  err.textContent = "";

  var btn = document.getElementById('submitBtn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>' + T.sending_text;

  document.querySelectorAll('.options').forEach(collect);
  var confSujet = document.querySelector('input[name="conf_sujet"]:checked');

  var payload = Object.assign({}, data, {
    prenom: prenom,
    email: email,
    telephone: telephone,
    canal: canal,
    recommandeur: document.getElementById('recommandeur').value.trim(),
    q1Autre: document.getElementById('q1AutrePrecision').value.trim(),
    q2Autre: document.getElementById('q2AutrePrecision').value.trim(),
    confSujet: confSujet ? confSujet.value : "",
    eventVille: document.getElementById('eventVille').value.trim(),
    consentement: "Oui",
    langue: currentLang,
    origine: ORIGINE ? origineLisible(ORIGINE) : "",
    destinataire: CONFIG.EMAIL,
    espace: CONFIG.MARQUE + " — " + CONFIG.PRENOM,
    page: window.location.href,
    date: new Date().toISOString()
  });

  fetch(CONFIG.ENDPOINT, {
    method: 'POST',
    mode: 'no-cors',
    headers: { 'Content-Type':'text/plain;charset=utf-8' },
    body: JSON.stringify(payload)
  }).then(afficherMerci).catch(afficherMerci);
}

function afficherMerci(){
  var prenom = document.getElementById('prenom').value.trim();
  document.getElementById('fin').classList.add('hidden');
  document.getElementById('div3').classList.add('hidden');
  show('merci');
  document.getElementById('merciTitre').textContent = TRANSLATIONS[currentLang].merci_prefix + ', ' + prenom + '.';
  window.setTimeout(function(){
    document.getElementById('merci').scrollIntoView({ behavior:'smooth', block:'start' });
  }, 100);
}

/* ─────────── Démarrage ─────────── */
appliquerConfig();
if(ORIGINE){ document.getElementById('recommandeur').value = origineLisible(ORIGINE); }
(function(){
  var l = '';
  try { l = (new URLSearchParams(window.location.search).get('lang') || '').toLowerCase().slice(0, 2); } catch(e){}
  setLanguage(TRANSLATIONS[l] ? l : 'fr');
})();
</script>
