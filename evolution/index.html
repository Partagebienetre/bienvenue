<script>

const params=new URLSearchParams(location.search);
const URL_ORIGIN=params.get('origin')||params.get('shared_by')||'';

function domaine(key,label,affs){
  return affs.map((a,i)=>({id:key+'_'+i,type:'scale',compact:true,domain:label,q:a,domainHead:(i===0?label:null),
    scale:{min:"Pas du tout d'accord",max:"Tout à fait d'accord"}}));

const CHAPTERS=[
{type:'intro'},

{ eyebrow:"Étape 1 · Premières impressions", title:"Trois premières impressions",

{ eyebrow:"Étape 2 · Ma roue de vie (1/2)", title:"Ma roue de vie",

{ eyebrow:"Étape 3 · Ma roue de vie (2/2)", title:"Ma roue de vie",

    ...domaine('rv_evolution',"Évolution & accomplissement",[

    ...domaine('rv_equilibre',"Équilibre de vie",[

{ eyebrow:"Étape 4 · Ma vie aujourd'hui", title:"Ma vie aujourd'hui",

function visibleQuestions(ch){return ch.questions?ch.questions.filter(q=>!q.showIf||q.showIf()):[];}
function optionValues(q){
  const vals=[];
  (q.options||[]).forEach(o=>{if(typeof o==='string')vals.push(o);});
  if(q.allowOther)vals.push('__OTHER__');
  const esc=q.escapes||['unsure','refuse'];
  if(esc.includes('unsure'))vals.push(UNSURE);
  if(esc.includes('refuse'))vals.push(REFUSE);
  return vals;
}
function isExclusive(q,val){if(val===UNSURE||val===REFUSE)return true;return (q.exclusive||[]).includes(val);}

function renderQuestion(q){
  let inner='';
  if(q.type==='multi'||q.type==='single'){
    inner='<div class="options">';let strIdx=0;
    (q.options||[]).forEach(o=>{
      if(typeof o!=='string'){inner+=`<div class="group-sub">${t(o.group)}</div>`;return;}
      inner+=optRow(q,strIdx++,o,false);
    });
    if(q.allowOther)inner+=otherRow(q,strIdx++);
    const esc=q.escapes||['unsure','refuse'];
    if(esc.includes('unsure'))inner+=optRow(q,strIdx++,UNSURE,true);
    if(esc.includes('refuse'))inner+=optRow(q,strIdx++,REFUSE,true);
    inner+='</div>';
    if(q.maxSelect){
      const n=Array.isArray(A()[q.id])?A()[q.id].filter(v=>!isExclusive(q,v)).length:0;
      inner+=`<div class="maxnote">${n} / ${q.maxSelect} ${t('sélectionné(s)')}</div>`;
    }
  }else if(q.type==='scale'){inner=renderScale(q);}
  else if(q.type==='text'){const v=A()[q.id]||'';
    inner=`<input class="text" type="text" value="${esc(v)}" maxlength="6000" oninput="setText('${q.id}',this.value)" placeholder="${esc(t(q.placeholder||'Votre réponse (facultatif)…'))}">`;}

    inner=`<textarea maxlength="6000" oninput="setText('${q.id}',this.value)" placeholder="${esc(t('Écrivez librement (facultatif)…'))}">${esc(v)}</textarea>`;}
  return `<div class="q ${q.compact?'compact':''}" id="q_${q.id}">
    ${q.domainHead?`<div class="domain-head">${t(q.domainHead)}</div>`:''}
    <div class="q-text">${t(q.q)}</div>
    ${q.hint?`<div class="q-hint">${t(q.hint)}</div>`:''}
    ${inner}</div>`;
}
function optRow(q,idx,label,isEscape){
  const cur=A()[q.id];
  const sel=(q.type==='single')?(cur===label):(Array.isArray(cur)&&cur.includes(label));
  return `<div class="opt ${isEscape?'escape':''} ${sel?'selected':''}" onclick="toggle('${q.id}',${idx})">
    <div class="box">${svgCheck}</div><div class="lbl">${t(label)}</div></div>`;
}
function otherRow(q,idx){
  const active=Array.isArray(A()[q.id])&&A()[q.id].includes('__OTHER__');
  const v=STATE.others[q.id]||'';
  return `<div class="opt ${active?'selected':''}" onclick="toggle('${q.id}',${idx})">
    <div class="box">${svgCheck}</div><div class="lbl">${t('Autre…')}</div></div>
    ${active?`<div class="other-field"><input type="text" value="${esc(v)}" oninput="setOther('${q.id}',this.value)" placeholder="${esc(t('Précisez…'))}" onclick="event.stopPropagation()"></div>`:''}`;
}
function renderScale(q){
  const has=typeof A()[q.id]==='number';
  const val=has?A()[q.id]:0;
  return `<div class="slider-wrap ${has?'':'untouched'}" id="${q.id}_wrap">
    <div class="slider-valeur" id="${q.id}_val">${has?val:'—'}</div>
    <input type="range" min="0" max="10" step="1" value="${val}" id="${q.id}" aria-label="${esc(t(q.q))}" oninput="majSlider('${q.id}')" onchange="majSlider('${q.id}')">
    ${q.scale?`<div class="slider-legende"><span>${t(q.scale.min)}</span><span>${t(q.scale.max)}</span></div>`:''}
  </div>`;
}
function toggle(id,idx){
  const q=findQ(id);const vals=optionValues(q);const val=vals[idx];const cur=A();
  if(q.type==='single'){cur[id]=(cur[id]===val)?undefined:val;reRender(id);return;}
  if(!Array.isArray(cur[id]))cur[id]=[];
  const arr=cur[id];const selected=arr.includes(val);
  if(val==='__OTHER__'){
    if(selected){cur[id]=arr.filter(v=>v!=='__OTHER__');delete STATE.others[id];}
    else{if(q.maxSelect&&arr.filter(v=>!isExclusive(q,v)).length>=q.maxSelect){flashMax(id);return;}
      cur[id]=arr.filter(v=>!isExclusive(q,v)).concat('__OTHER__');STATE.others[id]='';}
    reRender(id);return;
  }
  if(isExclusive(q,val)){cur[id]=selected?[]:[val];if(!selected)delete STATE.others[id];reRender(id);return;}
  if(selected){cur[id]=arr.filter(v=>v!==val);}
  else{let base=arr.filter(v=>!isExclusive(q,v));
    if(q.maxSelect&&base.length>=q.maxSelect){flashMax(id);return;}
    base.push(val);cur[id]=base;}
  reRender(id);
}

function buildPayload(){
  const seen=[];
  CHAPTERS.forEach(ch=>{if(!ch.questions)return;
    visibleQuestions(ch).forEach(q=>{
      let ans=A()[q.id];let repondu=true;
      if(ans===undefined||ans===''||(Array.isArray(ans)&&ans.length===0)){ans='';repondu=false;}
      if(ans===REFUSE){repondu=false;}
      if(ans===UNSURE){repondu=false;}
      if(Array.isArray(ans)){
        ans=ans.map(v=>v==='__OTHER__'?('Autre : '+(STATE.others[q.id]||'')):v);
        if(ans.some(v=>v===UNSURE||v===REFUSE))repondu=false;
        ans=ans.join(' · ');
      }
      seen.push({etape:ch.title,id:q.id,question:q.q,type:q.type,reponse:String(ans),repondu:repondu});
    });
  });
  const dom={};
  CHAPTERS.forEach(ch=>{if(!ch.questions)return;ch.questions.forEach(q=>{
    if(q.domain&&typeof A()[q.id]==='number'){(dom[q.domain]=dom[q.domain]||[]).push(A()[q.id]);}});});
  const roue=Object.keys(dom).map(d=>({domaine:d,moyenne:Math.round((dom[d].reduce((a,b)=>a+b,0)/dom[d].length)*10)/10,notes:dom[d]}));

 ['rv_relations','Relations & entourage'],['rv_epano','Épanouissement personnel'],

];
function donneesRoues() {
 const impressions=['imp_global','imp_perso','imp_pro'].map(id=>typeof A()[id]==='number'?A()[id]:null);
 const domaines=DOMAINES_ROUE.map(([key])=>{
  const notes=[0,1,2].map(i=>A()[key+'_'+i]).filter(v=>typeof v==='number');
  return notes.length?notes.reduce((a,b)=>a+b,0)/notes.length:null;
 });
 return {impressions,domaines};

function dessinerRoue(labels,values) {
 const canvas=document.createElement('canvas');canvas.width=1200;canvas.height=860;
 const c=canvas.getContext('2d'); const cx=600,cy=430,r=285,n=labels.length;
 c.fillStyle='#FFFFFF';c.fillRect(0,0,1200,860);
 const angle=i=>-Math.PI/2+(i-.5)*Math.PI*2/n;
 for(let i=0;i<n;i++){
  if(values[i]===null)continue;
  c.beginPath();c.moveTo(cx,cy);c.arc(cx,cy,r*values[i]/10,angle(i),angle(i+1));c.closePath();
  c.fillStyle=i%2?'#A6B7A3':'#6E8B72';c.fill();
 }
 c.strokeStyle='#D8DED5';c.lineWidth=2;
 for(let j=1;j<=10;j++){c.beginPath();c.arc(cx,cy,r*j/10,0,Math.PI*2);c.stroke();}
 for(let i=0;i<n;i++){
  c.beginPath();c.moveTo(cx,cy);c.lineTo(cx+r*Math.cos(angle(i)),cy+r*Math.sin(angle(i)));c.stroke();
  const mid=(angle(i)+angle(i+1))/2,lx=cx+(r+65)*Math.cos(mid),ly=cy+(r+65)*Math.sin(mid);
  const words=labels[i].split(' '),lines=[];let line='';
  for(const w of words){if((line+' '+w).trim().length>21&&line){lines.push(line);line=w;}else line=(line+' '+w).trim();}lines.push(line);
  c.textAlign=Math.cos(mid)>.35?'left':Math.cos(mid)<-.35?'right':'center';
  c.fillStyle='#2E3830';c.font='23px Arial';
  lines.forEach((t,k)=>c.fillText(t,lx,ly+(k-(lines.length-1)/2)*28));
  c.font='bold 25px Arial';c.fillStyle=values[i]===null?'#8A8A7E':'#6E8B72';
  c.fillText(values[i]===null?'—':(Math.round(values[i]*10)/10).toLocaleString('fr-FR')+' / 10',lx,ly+(lines.length+1)/2*28);
 }
 c.textAlign='center';c.font='18px Arial';
 for(const j of [2,4,6,8,10]){c.fillStyle='#FFFFFF';c.fillRect(cx-14,cy+r*j/10-12,28,22);c.fillStyle='#526150';c.fillText(String(j),cx,cy+r*j/10+5);}
 return canvas.toDataURL('image/png');
}

}
function besoinSanteExplicite(texte){
 const s=String(texte||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
 return s.split(/[.!?;\n]/).some(phrase=>{
  if(/\b(ne|pas|aucun|sans|ni)\b/.test(phrase))return false;
  return /(?:ameliorer|retrouver|preserver)\s+(?:ma|la|une meilleure)\s+sante|(?:plus|davantage)\s+de\s+sante|(?:besoin|envie|souhaite|voudrais|aimerais).{0,45}(?:meilleure sante|bonne sante|plus d.energie|moins de fatigue)/.test(phrase);
 });
}

function verifierReception(id){
 return new Promise((resolve,reject)=>{
  const nom='retourBilan_'+id.replace(/-/g,'')+'_'+Date.now();
  const balise=document.createElement('script');
  const fin=()=>{clearTimeout(delai);delete window[nom];balise.remove();};
  const delai=setTimeout(()=>{fin();reject(new Error(t('Délai dépassé')));},15000);
  window[nom]=data=>{fin();resolve(data);};
  balise.onerror=()=>{fin();reject(new Error(t('Vérification indisponible')));};
  balise.src=CONFIG.webhookUrl+'?action=status&id='+encodeURIComponent(id)+'&callback='+nom;
  document.head.appendChild(balise);
 });
}
async function submitForm(){

 error.textContent='';

  error.textContent=t('Indiquez votre prénom et une adresse e-mail valide.');return;
 }
 if(!STATE.consent){error.textContent=t('Votre accord est nécessaire pour préparer et envoyer votre carnet.');return;}
 if(!/^https:\/\/script\.google\.com\/macros\/s\/[^/]+\/exec$/.test(CONFIG.webhookUrl)){
  error.textContent=t('Le formulaire est en cours de configuration. Contact : ')+CONFIG.partner.email;return;
 }
 btn.disabled=true;btn.textContent=t('Préparation de votre carnet…');
 try{
  if(!STATE.submissionId){
   STATE.submissionId=crypto.randomUUID();
   STATE.pendingPayload=Object.assign(buildPayload(),{submissionId:STATE.submissionId,roues:imagesRoues()});
  }
  await fetch(CONFIG.webhookUrl,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(STATE.pendingPayload)});
  let resultat=await verifierReception(STATE.submissionId);
  for(let i=0;i<8&&resultat.status==='EN_COURS';i++){
   await new Promise(r=>setTimeout(r,3000));resultat=await verifierReception(STATE.submissionId);
  }
  if(resultat.status!=='ENVOYE')throw new Error(t('Le carnet n\'a pas encore été confirmé comme envoyé. Contactez ')+CONFIG.partner.email+t(' si vous ne le recevez pas. Référence : ')+STATE.submissionId);
  CHAPTERS.push({type:'thanks'});STATE.idx=CHAPTERS.length-1;render();
 }catch(e){error.textContent=e.message||t('Réception non confirmée. Vérifiez vos e-mails avant de réessayer.');btn.disabled=false;btn.textContent=t('Vérifier / réessayer l\'envoi');}
}

function copyLink(url){navigator.clipboard?.writeText(url).then(()=>{event.target.textContent=t('Lien copié ✓');}).catch(()=>{prompt('Copier :',url);});}
/* ── Sélecteur de langue ── */
function renderLangChips(){
  const list=CONFIG.langues||[{code:'fr',label:'Français',dispo:true}];
  if(list.length<=1)return '';
  return '<div class="lang-row">'+list.map(function(l){
    if(l.dispo)return `<button class="lang-chip ${l.code===CONFIG.langueActive?'active':''}" onclick="setLangue('${l.code}')">${l.label}</button>`;
    return `<button class="lang-chip" disabled aria-disabled="true">${l.label} · ${t('bientôt')}</button>`;
  }).join('')+'</div>';
}
function setLangue(code){
  const l=(CONFIG.langues||[]).find(x=>x.code===code);
  if(!l||!l.dispo)return;
  CONFIG.langueActive=code;
  render();
}

/* ── Lecture à voix haute (synthèse vocale du navigateur) ── */
function voiceLang(l){return {fr:'fr-FR',en:'en-GB',es:'es-ES',de:'de-DE'}[l]||'fr-FR';}
function getSpeechText(){
  const src=document.getElementById('app');if(!src)return '';
  const node=src.cloneNode(true);
  node.querySelectorAll('.slider-valeur').forEach(e=>e.remove()); // enlève les "—"/chiffres des curseurs
  return (node.textContent||'').replace(/\s+/g,' ').trim();
}
function setListenBtn(on){const b=document.getElementById('listenBtn');if(b){b.classList.toggle('on',on);b.innerHTML=on?t('⏹ Arrêter'):t('🔊 Écouter');}}
let speakKeepAlive=null;
function stopSpeak(){if(speakKeepAlive){clearInterval(speakKeepAlive);speakKeepAlive=null;}if('speechSynthesis' in window){window.speechSynthesis.cancel();}setListenBtn(false);}
function toggleSpeak(){
  if(!('speechSynthesis' in window)){alert(t("La lecture à voix haute n'est pas disponible sur ce navigateur."));return;}
  if(window.speechSynthesis.speaking||window.speechSynthesis.pending){stopSpeak();return;}
  const u=new SpeechSynthesisUtterance(getSpeechText());
  u.lang=voiceLang(CONFIG.langueActive||'fr');u.rate=1;
  u.onend=stopSpeak;u.onerror=stopSpeak;
  window.speechSynthesis.cancel();window.speechSynthesis.speak(u);setListenBtn(true);
  // Correctif Chrome : relance la lecture toutes les 10 s pour éviter qu'elle se coupe
  speakKeepAlive=setInterval(function(){if(window.speechSynthesis.speaking){window.speechSynthesis.pause();window.speechSynthesis.resume();}else{clearInterval(speakKeepAlive);speakKeepAlive=null;}},10000);
}

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

function openLegal(){const pn=document.getElementById('legalPanel');pn.innerHTML=renderLegal();pn.parentNode.scrollTop=0;document.getElementById('legalModal').classList.add('open');document.body.style.overflow='hidden';}

document.addEventListener('keydown',function(e){if(e.key==='Escape')closeLegal();});

render();
